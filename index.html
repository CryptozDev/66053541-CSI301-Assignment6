<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank DApp — จารุกิตติ์ โลบไธสง 66053541</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Azeret+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- แถบหัว: แบรนด์ + ชื่อนักศึกษา ซ้าย / กระเป๋าเงิน ขวา -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg>
      </span>
      <span class="brand-name">Bank DApp</span>
      <span class="student">จารุกิตติ์ โลบไธสง · 66053541</span>
    </div>
    <div class="wallet">
      <span id="accountInfo" class="account-info">ยังไม่ได้เชื่อมต่อ</span>
      <button id="connectBtn" class="btn btn-primary btn-connect">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V8a2 2 0 0 0-2-2H5a2 2 0 0 1 0-4h13"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        เชื่อมต่อ MetaMask
      </button>
    </div>
  </header>

  <main>
    <!-- แจ้งยอด: ตัวเลขใหญ่ + ข้อมูลสัญญา -->
    <section class="statement" aria-label="ยอดเงินคงเหลือ">
      <div class="statement-head">
        <h1 id="balance" class="balance">0.0 ETH</h1>
        <button id="refreshBtn" class="btn-quiet">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          รีเฟรชยอดเงิน
        </button>
      </div>
      <div class="statement-foot">
        <label for="contractAddress">สัญญา (Contract Address จาก Remix) — ครั้งเดียวพอ ระบบจำให้</label>
        <input type="text" id="contractAddress" placeholder="0x… วาง Address ของสัญญาที่ Deploy แล้ว" autocomplete="off" spellcheck="false" />
      </div>
    </section>

    <!-- พื้นที่ทำงาน: ฝาก / ถอน คู่กัน -->
    <div class="actions">
      <section class="panel" aria-label="ฝากเงิน">
        <h2 class="panel-title">
          <span class="panel-icon panel-icon-in" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          </span>
          ฝากเงิน
        </h2>
        <div class="amount-field">
          <input type="number" id="depositAmount" min="0" step="0.001" placeholder="0.01" aria-label="จำนวนเงินที่ต้องการฝาก (ETH)" />
          <span class="unit">ETH</span>
        </div>
        <button id="depositBtn" class="btn btn-primary btn-block">ฝากเงิน</button>
        <p class="hint">ยืนยันธุรกรรมใน MetaMask เพื่อฝากเงินเข้าสัญญา</p>
      </section>

      <section class="panel panel-withdraw" aria-label="ถอนเงิน">
        <h2 class="panel-title">
          <span class="panel-icon panel-icon-out" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
          </span>
          ถอนเงิน
        </h2>
        <div class="amount-field">
          <input type="number" id="withdrawAmount" min="0" step="0.001" placeholder="0.01" aria-label="จำนวนเงินที่ต้องการถอน (ETH)" />
          <span class="unit">ETH</span>
        </div>
        <button id="withdrawBtn" class="btn btn-danger btn-block">ถอนเงิน</button>
        <p class="hint">ถอนได้ไม่เกินยอดคงเหลือของคุณในสัญญา</p>
      </section>
    </div>
  </main>

  <!-- แถบสถานะ: บอกตรง ๆ ว่าธุรกรรมกำลังอยู่ในขั้นไหน -->
  <footer class="statusbar" aria-live="polite">
    <p id="status" class="status"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
